# Builds the Overleaf Extended CE image (base + community) and publishes it to
# GHCR. Same two steps as `make build-base build-community` in server-ce/.
#
#   push to `lirei`        -> :sha-<short>, :lirei
#   tag  `v*` (e.g. v6.3.0-ext-v5.1-lirei.1) -> :<tag>, :sha-<short>
#
# Deploy immutable tags only (:<tag> or :sha-<short>); :lirei moves.
#
# Runs on the lirei-lab scale set `sti-k8s` (UQTR STI cluster). Those runner
# pods have no Docker daemon, so the build itself happens in the shared rootless
# BuildKit daemon of that cluster (cluster-sti/buildkit), which also keeps the
# layer cache between builds.
name: build-image

on:
  push:
    branches: [lirei]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-cep-base
  IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-cep

jobs:
  build:
    runs-on: sti-k8s
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The Makefile copies this into the build context root before each build.
      - name: Use server-ce .dockerignore
        run: cp server-ce/.dockerignore .dockerignore

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      # docker/login-action needs a Docker daemon; buildx only needs the
      # credentials file, which it forwards to the remote builder.
      - name: GHCR credentials
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.docker
          auth=$(printf '%s:%s' "${{ github.actor }}" "$TOKEN" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > ~/.docker/config.json
          chmod 600 ~/.docker/config.json

      - id: short
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server-ce/Dockerfile-base
          pull: true
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:${{ steps.short.outputs.sha }}
            ${{ env.BASE_IMAGE }}:lirei

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.short.outputs.sha }}
            type=raw,value=lirei,enable=${{ github.ref == 'refs/heads/lirei' }}
          labels: |
            com.overleaf.ce.revision=${{ github.sha }}

      - name: Build Overleaf image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server-ce/Dockerfile
          push: true
          build-args: |
            OVERLEAF_BASE_TAG=${{ env.BASE_IMAGE }}:${{ steps.short.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
