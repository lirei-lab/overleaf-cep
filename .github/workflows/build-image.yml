# Builds the Overleaf Extended CE image (base + community) and publishes it to
# GHCR. Same two steps as `make build-base build-community` in server-ce/.
#
#   push to `lirei`        -> :sha-<short>, :lirei
#   tag  `v*` (e.g. v6.3.0-ext-v5.1-lirei.1) -> :<tag>, :sha-<short>
#
# Deploy immutable tags only (:<tag> or :sha-<short>); :lirei moves.
name: build-image

on:
  push:
    branches: [lirei]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-cep-base
  IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-cep

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The base image installs TeX Live and the final image runs webpack:
      # the runner's default ~14 GB free is not enough.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      # The Makefile copies this into the build context root before each build.
      - name: Use server-ce .dockerignore
        run: cp server-ce/.dockerignore .dockerignore

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: short
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile-base
          pull: true
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:${{ steps.short.outputs.sha }}
            ${{ env.BASE_IMAGE }}:lirei
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.short.outputs.sha }}
            type=raw,value=lirei,enable=${{ github.ref == 'refs/heads/lirei' }}
          labels: |
            com.overleaf.ce.revision=${{ github.sha }}

      - name: Build Overleaf image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile
          push: true
          build-args: |
            OVERLEAF_BASE_TAG=${{ env.BASE_IMAGE }}:${{ steps.short.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=community
          cache-to: type=gha,scope=community,mode=max
