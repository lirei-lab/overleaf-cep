apiVersion: v1
kind: Secret
metadata:
  name: {{ include "overleaf.fullname" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
type: Opaque
stringData:
  OVERLEAF_OIDC_CLIENT_ID: {{ required "A valid overleaf.oidc.clientId is required!" .Values.overleaf.oidc.clientId | quote }}
  OVERLEAF_OIDC_CLIENT_SECRET: {{ required "A valid overleaf.oidc.clientSecret is required!" .Values.overleaf.oidc.clientSecret | quote }}
