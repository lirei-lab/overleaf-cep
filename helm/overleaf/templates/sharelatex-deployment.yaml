apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "overleaf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Restart the pod when its env changes (envFrom is only read at start).
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/sharelatex-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/sharelatex-secret.yaml") . | sha256sum }}
      labels:
        {{- include "overleaf.selectorLabels" . | nindent 8 }}
    spec:
      # Nothing in Overleaf talks to the Kubernetes API; do not hand compiles a token.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false

      initContainers:
        - name: wait-for-mongo
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-mongodb-headless.{{ .Release.Namespace }}.svc.cluster.local 27017; do
                echo "Waiting for MongoDB..."; sleep 3;
              done
              echo "MongoDB is ready!"
        - name: texlive-provisioner
          image: debian:bookworm-20251229-slim
          command:
            - "bash"
            - "-c"
            - |
              set -euo pipefail
              TL_VERSION=2024
              TL_DIR=/mnt/texlive-pvc/${TL_VERSION}
              TL_BIN=${TL_DIR}/bin/x86_64-linux
              TL_REPO=https://texlive.info/historic/systems/texlive/${TL_VERSION}/tlnet-final

              if [ -d "${TL_BIN}" ] && [ -f "${TL_BIN}/pdflatex" ]; then
                echo "TeX Live ${TL_VERSION} already provisioned. Skipping."
                exit 0
              fi

              echo "=== Installing TeX Live ${TL_VERSION} to PVC ==="
              rm -rf /mnt/texlive-pvc/*

              apt-get update -qq && apt-get install -y --no-install-recommends \
                curl perl wget ca-certificates fontconfig > /dev/null 2>&1

              echo "Downloading install-tl..."
              cd /tmp
              curl -fsSL https://texlive.info/historic/systems/texlive/${TL_VERSION}/install-tl-unx.tar.gz \
                | tar -xz --strip-components=1

              echo "Running install-tl (scheme-full, this will take 2-4 hours)..."
              ./install-tl \
                --no-interaction \
                --scheme=full \
                --texdir=/mnt/texlive-pvc/${TL_VERSION} \
                --texuserdir=/mnt/texlive-pvc/texmf-local \
                --repository=${TL_REPO}

              echo "Rebuilding font maps and format files..."
              export PATH=${TL_BIN}:$PATH
              mktexlsr
              updmap-sys
              fmtutil-sys --all < /dev/null || true

              echo "=== TeX Live ${TL_VERSION} installation complete ==="
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: texlive
              mountPath: /mnt/texlive-pvc
            {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: PATH
              value: /usr/local/texlive/2024/bin/x86_64-linux:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          envFrom:
            - configMapRef:
                name: {{ include "overleaf.fullname" . }}-config
            - secretRef:
                name: {{ include "overleaf.fullname" . }}-oidc
            {{- with .Values.overleaf.appSecretsName }}
            # Stable app secrets (OVERLEAF_INVITE_TOKEN_SECRET, required since
            # v6.3), created once outside Helm so an upgrade can never rotate them.
            - secretRef:
                name: {{ . }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/lib/overleaf
            - name: texlive
              mountPath: /usr/local/texlive
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-data
        - name: texlive
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-texlive
        {{- end }}
